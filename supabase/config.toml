# LokPulse Supabase — Option A reconciled config
# Scheme SoT remains src/assistant/data/schemes.ts
# public.schemes is Kashif's optional enrichment cache only.

project_id = "lokpulse-sih26091"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/scheme_cache_v0.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MiB"

# Kashif owns live-scheme-retrieval — do not duplicate.
[functions.live-scheme-retrieval]
verify_jwt = false
